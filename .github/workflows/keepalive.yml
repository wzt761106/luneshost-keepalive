name: LunesHost 自动登录保活

on:
  schedule:
    - cron: "0 8 */5 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 执行登录保活
        env:
          LUNESHOST_EMAIL:    ${{ secrets.LUNESHOST_EMAIL }}
          LUNESHOST_PASSWORD: ${{ secrets.LUNESHOST_PASSWORD }}
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          node login.js
